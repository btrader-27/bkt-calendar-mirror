name: calendar-mirror
# Pulls the ForexFactory weekly feeds from a GitHub runner (its own egress IP,
# so no Cloudflare shared-IP rate limiting) and commits the normalized
# calendar.json that the bkt-calendar Worker reads.
#
# TWO STEPS, TWO SOURCES (v2):
#   fetch_calendar.py  the weekly JSON feed. Schedule data: what is coming,
#                      when, with forecast and previous. Stable for days.
#   fetch_actuals.py   the calendar HTML page. Released values only. The JSON
#                      feed has no actual column and never has, so this is the
#                      only place a printed number can come from.
#
# GitHub's scheduler can run late under load, sometimes by 10 to 15 minutes.
# That was fine when this only carried schedule data measured in hours. It is
# tighter now: a 6:00 AM ET European print needs to be in calendar.json before
# the 7:00 AM brief goes out, so the cadence moved from 3 hourly to hourly.
# A run is two HTTP requests and finishes in well under a minute, and public
# repos get unlimited Actions minutes, so the extra frequency costs nothing.
on:
  schedule:
    # Hourly at :17. The Sunday 07:17 run is still the important one for the
    # weekly roll: it catches FF's roll before the 17:00 ET open.
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calendar-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    # One feed, one retry with a 330s backoff, plus up to a few day pages for
    # actuals. Happy path is under a minute, worst case about 8.
    timeout-minutes: 15
    steps:
      - name: Checkout
        # fetch-depth 0 rather than the default shallow clone: the push step
        # rebases onto origin/main when a concurrent run has already landed,
        # and a depth-1 clone has no history to rebase against.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --quiet beautifulsoup4
      - name: Fetch and normalize calendar
        run: python scripts/fetch_calendar.py
      # Backfills the `actual` field on events that have already passed.
      # Deliberately NOT fatal: ForexFactory may challenge the runner or change
      # its markup, and neither should take down the schedule data that the
      # member facing calendar depends on. The script exits 0 and leaves
      # calendar.json untouched on any soft failure, and `|| true` guards
      # against an unhandled crash doing the same.
      - name: Backfill released values
        run: python scripts/fetch_actuals.py || true
      - name: Commit if changed
        # PUSH HARDENING (v3). At 3 hourly cadence a collision was unlikely. At
        # hourly it is a matter of time, and a plain `git push` fails with
        # "! [rejected] main -> main (fetch first)" the moment anything else has
        # landed on main since checkout. That is not hypothetical: it was hit on
        # 2026-08-11 when a re-run of an older scheduled run tried to push from
        # a commit that was behind.
        #
        # Two sources of collision:
        #   1. A human commit to the repo while a scheduled run is in flight.
        #   2. Two mirror runs overlapping. The concurrency group serialises
        #      them, but a queued run still checked out its own ref earlier.
        #
        # Rebase is the right merge strategy here rather than a merge commit:
        # calendar.json is machine generated, our commit is always a single
        # whole-file replacement, and replaying it on top of whatever landed is
        # exactly the intended outcome. Retried three times with a short sleep
        # so a burst of activity does not need a manual re-run.
        run: |
          set -euo pipefail
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add calendar.json
          if git diff --staged --quiet; then
            echo "No change, nothing to commit."
            exit 0
          fi
          git commit -m "calendar: refresh $(date -u '+%Y-%m-%dT%H:%MZ')"
          # Explicit refspec rather than a bare `git push`: that form depends on
          # upstream tracking config being exactly right, and fails confusingly
          # ("upstream branch does not match") when it is not. HEAD:main states
          # the intent directly and is immune to that.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt, rebasing onto origin/main."
            # --autostash covers any stray working-tree change; without it a
            # dirty tree aborts the rebase and the retry loop spins pointlessly.
            git fetch origin main
            git rebase --autostash origin/main || {
              echo "Rebase failed. Leaving main untouched rather than forcing."
              git rebase --abort || true
              exit 1
            }
            sleep 5
          done
          echo "Push still failing after 3 attempts."
          exit 1
