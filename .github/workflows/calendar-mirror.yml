name: calendar-mirror

# Pulls the ForexFactory weekly feeds from a GitHub runner (its own egress IP,
# so no Cloudflare shared-IP rate limiting) and commits the normalized
# calendar.json that the bkt-calendar Worker reads.
#
# GitHub's scheduler can run late under load, sometimes by 10 to 15 minutes.
# That is fine here: the weekly feeds cover a full week ahead, so freshness is
# measured in hours, not minutes.

on:
  schedule:
    # Every 3 hours. Times are UTC. A normal run is a single HTTP request and
    # finishes in well under a minute, and public repos get unlimited Actions
    # minutes, so frequency is effectively free. The Sunday 07:17 run is the
    # important one: it catches FF's weekly roll before the 17:00 ET open.
    - cron: '17 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    # One feed, one retry with a 330s backoff. Happy path is under a minute,
    # worst case about 6.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and normalize calendar
        run: python scripts/fetch_calendar.py

      - name: Commit if changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add calendar.json
          if git diff --staged --quiet; then
            echo "No change, nothing to commit."
          else
            git commit -m "calendar: refresh $(date -u '+%Y-%m-%dT%H:%MZ')"
            git push
          fi
